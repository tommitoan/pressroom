<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Pressroom sample</title>
<style>
  @page { size: A4; }
  body { font-family: "Noto Serif", "Noto Serif CJK SC", serif; background: #faf3dc; color: #2b2118; }
  h1 { margin: 0 0 8mm; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #8a7a5a; padding: 2mm; }
  .page { break-after: page; }
  .han { font-size: 28pt; letter-spacing: 4mm; }
</style>
</head>
<body>
<section class="page">
  <h1>Bát tự — Lá số mẫu</h1>
  <p>Nhật chủ Tân Kim, sinh ngày mùng tám tháng sáu năm Ất Hợi.</p>
  <p class="han">甲乙丙丁戊己庚辛壬癸</p>
  <p class="han">子丑寅卯辰巳午未申酉戌亥</p>
</section>
<section class="page">
  <h1>Đại vận</h1>
  <table>
    <tr><th>Tuổi</th><th>Trụ</th><th>Thập thần</th></tr>
    <tr><td>3–12</td><td>壬午</td><td>Thương quan</td></tr>
    <tr><td>13–22</td><td>癸未</td><td>Thực thần</td></tr>
    <tr><td>23–32</td><td>甲申</td><td>Chính tài</td></tr>
  </table>
</section>
<section>
  <h1>Lưu niên</h1>
  <p>Trang cuối cùng của tài liệu mẫu.</p>
</section>
</body>
</html>
