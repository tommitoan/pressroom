name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  # Drives the installed Chrome. Not required to pass yet: the runner's sandbox
  # and CJK fonts have not been confirmed, so this reports without blocking.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-core
      - name: browser tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROMIUM_NO_SANDBOX: "true"
        run: make e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: docker build -t pressroom:ci .
      - name: browser starts and answers
        run: |
          docker run -d --name pressroom -p 8080:8080 \
            -e PRESSROOM_TOKEN=ci-token-0123456789abcdef pressroom:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ready)"
            [ "$code" = 200 ] && exit 0
            sleep 1
          done
          docker logs pressroom
          exit 1
      - name: contract test against the image
        env:
          PRESSROOM_URL: http://localhost:8080
          PRESSROOM_TOKEN: ci-token-0123456789abcdef
        run: make contract
