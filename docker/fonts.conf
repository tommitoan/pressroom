<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Makes the generic families resolve to the bundled Noto fonts, so a page
     that only says "serif" or "sans-serif" still gets glyphs. -->
<fontconfig>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Noto Sans</family><family>Noto Serif CJK SC</family></prefer>
  </alias>
</fontconfig>
